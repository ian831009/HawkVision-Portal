<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>HawkVision</title>
  <link rel="icon" type="image/png" href="favicon.png?v=1.1.3" />
  <link rel="apple-touch-icon" href="hawkvision-app-icon.png?v=1.1.3" />
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#08111f;--panel:#0f1c2e;--panel2:#13243a;--text:#f8fafc;--muted:#9fb0c8;
      --line:rgba(255,255,255,.10);--accent:#3b82f6;--accent2:#60a5fa;--danger:#ef4444;
      --success:#22c55e
    }
    body{
      margin:0;min-height:100vh;font-family:Arial,"Noto Sans TC",sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 15% 5%,rgba(37,99,235,.20),transparent 30%),
        radial-gradient(circle at 85% 95%,rgba(14,165,233,.13),transparent 30%),
        var(--bg)
    }
    .shell{min-height:100vh;display:flex;flex-direction:column}
    header{
      min-height:78px;padding:16px 24px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(8,17,31,.72);
      backdrop-filter:blur(14px);position:sticky;top:0;z-index:10
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:44px;height:44px;object-fit:contain}
    .brand-title{font-size:22px;font-weight:800;letter-spacing:.2px}
    .brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
    .version{font-size:12px;color:#cbd5e1;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
    main{width:min(1060px,calc(100% - 32px));margin:auto;padding:38px 0}
    .card{
      background:linear-gradient(180deg,rgba(19,36,58,.96),rgba(15,28,46,.96));
      border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 70px rgba(0,0,0,.30)
    }
    #loginView{max-width:500px;margin:0 auto;padding:28px}
    h1,h2,p{margin-top:0}
    #loginView h1{font-size:26px;margin-bottom:8px}
    .lead{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
    input{
      width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
      background:#0a1626;color:var(--text);font-size:16px;outline:none
    }
    input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.12)}
    .pw{display:flex;gap:8px}
    .pw input{flex:1}
    button,.product{
      border:0;border-radius:12px;font-weight:800;cursor:pointer;transition:.18s ease
    }
    button:active,.product:active{transform:scale(.985)}
    .eye{width:50px;background:#1e293b;color:#dbeafe;font-size:18px}
    .primary{width:100%;margin-top:18px;padding:13px;background:linear-gradient(90deg,#2563eb,#3b82f6);color:white;font-size:15px}
    .primary:disabled{opacity:.55;cursor:not-allowed}
    .msg{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:700}
    .msg.error{display:block;background:rgba(239,68,68,.12);color:#fecaca;border:1px solid rgba(239,68,68,.22)}
    .msg.success{display:block;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.22)}
    #passwordClaimView{display:none}
    .claim-actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
    .claim-actions .primary{margin-top:0;min-height:48px;padding:12px 16px;font-size:14px;line-height:1.35;white-space:normal}
    .claim-back{width:100%;min-height:46px;padding:11px 16px;background:#1e293b;color:#e2e8f0;font-size:14px;line-height:1.35}
    .claim-hint{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 20px}
    #passwordClaimView label{display:block;margin:15px 0 7px;line-height:1.35}
    #passwordClaimView .pw{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:stretch}
    #passwordClaimView .pw input{min-width:0;width:100%;height:48px;padding:0 14px;font-size:14px;line-height:48px}
    #passwordClaimView .pw .eye{width:48px;min-width:48px;height:48px;padding:0;font-size:16px}
    @media(max-width:760px){
      #passwordClaimView .claim-hint{font-size:12px;line-height:1.6;margin-bottom:18px}
      #passwordClaimView label{margin:13px 0 6px;font-size:13px}
      #passwordClaimView .pw{grid-template-columns:minmax(0,1fr) 44px;gap:7px}
      #passwordClaimView .pw input{height:46px;padding:0 12px;font-size:14px;line-height:46px}
      #passwordClaimView .pw .eye{width:44px;min-width:44px;height:46px;font-size:15px}
      #passwordClaimView .claim-actions{gap:10px;margin-top:18px}
      #passwordClaimView .claim-actions .primary{min-height:46px;padding:11px 12px;font-size:13px}
      #passwordClaimView .claim-back{min-height:44px;padding:10px 12px;font-size:13px}
    }

    /* v1.1.12 首次改密碼介面：只調整內部控制項，不改外框 */
    #passwordClaimView,
    #passwordClaimView *{box-sizing:border-box}
    #passwordClaimView .pw{
      width:calc(100% - 24px);
      margin-left:auto;
      margin-right:auto;
      grid-template-columns:minmax(0,1fr) 46px;
      gap:10px;
    }
    #passwordClaimView .pw input{
      width:100%;
      min-width:0;
      max-width:100%;
      height:46px;
      padding:0 12px;
      font-size:14px;
      line-height:1.2;
    }
    #passwordClaimView .pw .eye{
      width:46px;
      min-width:46px;
      max-width:46px;
      height:46px;
      padding:0;
      font-size:15px;
    }
    #passwordClaimView label,
    #passwordClaimView .claim-actions{
      width:calc(100% - 24px);
      margin-left:auto;
      margin-right:auto;
    }
    #passwordClaimView .claim-actions .primary,
    #passwordClaimView .claim-back{
      width:100%;
      max-width:100%;
      min-height:44px;
      padding:10px 14px;
      font-size:13px;
      line-height:1.35;
      white-space:normal;
    }
    @media(max-width:760px){
      #passwordClaimView .pw,
      #passwordClaimView label,
      #passwordClaimView .claim-actions{
        width:calc(100% - 20px);
      }
      #passwordClaimView .pw{
        grid-template-columns:minmax(0,1fr) 42px;
        gap:8px;
      }
      #passwordClaimView .pw input{
        height:44px;
        padding:0 11px;
        font-size:13px;
      }
      #passwordClaimView .pw .eye{
        width:42px;
        min-width:42px;
        max-width:42px;
        height:44px;
        font-size:14px;
      }
      #passwordClaimView .claim-actions .primary,
      #passwordClaimView .claim-back{
        min-height:42px;
        padding:9px 11px;
        font-size:12.5px;
      }
    }
    #launcherView{display:none}
    .welcome{padding:24px 26px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .welcome h2{margin-bottom:5px;font-size:24px}
    .welcome p{color:var(--muted);margin:0;font-size:13px}
    .logout{padding:10px 14px;background:#1e293b;color:#e2e8f0}
    .products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .product{
      min-height:190px;padding:22px;text-align:left;color:white;border:1px solid var(--line);
      background:linear-gradient(145deg,rgba(30,41,59,.90),rgba(15,23,42,.92));
      display:flex;flex-direction:column;justify-content:space-between;text-decoration:none
    }
    .product:hover{border-color:rgba(96,165,250,.65);transform:translateY(-2px);box-shadow:0 16px 32px rgba(0,0,0,.20)}
    .product-icon{font-size:30px}
    .product h3{font-size:20px;margin:14px 0 7px}
    .product p{font-size:13px;line-height:1.6;color:#b8c6d9;margin:0}
    .enter{margin-top:18px;color:#93c5fd;font-size:13px;font-weight:800}
    .none{padding:28px;text-align:center;color:var(--muted)}
    footer{text-align:center;color:#64748b;font-size:11px;padding:20px}
    @media(max-width:760px){
      header{padding:13px 16px}.brand-title{font-size:19px}.brand-sub{display:none}
      main{width:min(100% - 22px,1060px);padding:24px 0}
      #loginView{padding:22px}.products{grid-template-columns:1fr}
      .product{min-height:150px}.welcome{padding:19px}
    }
  
    .hv-intro{
      position:fixed;inset:0;z-index:9999;background:#08111f;display:flex;align-items:center;justify-content:center;
      transition:opacity .45s ease,visibility .45s ease
    }
    .hv-intro.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
    .hv-intro-brand{text-align:center;animation:hvIntroRise .8s ease-out both}
    .hv-intro-logo{width:126px;height:126px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(96,165,250,.22));animation:hvLogoPulse 1.2s ease-in-out both}
    .hv-intro-name{font-size:38px;font-weight:900;letter-spacing:.5px;margin-top:10px}
    .hv-intro-name span{color:#60a5fa}
    .hv-intro-slogan{margin-top:9px;color:#9fb0c8;font-size:12px;letter-spacing:2px}
    @keyframes hvIntroRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes hvLogoPulse{0%{opacity:0;transform:scale(.82)}55%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}

  </style>
</head>
<body>
<div id="hvIntro" class="hv-intro" aria-label="HawkVision 品牌開場">
  <div class="hv-intro-brand">
    <img class="hv-intro-logo" src="hawkvision-logo.png" alt="HawkVision">
    <div class="hv-intro-name">Hawk<span>Vision</span></div>
    <div class="hv-intro-slogan">SEE EVERY MOVE. STAY AHEAD.</div>
  </div>
</div>
<div class="shell">
  <header>
    <div class="brand">
      <img src="hawkvision-logo.png" alt="HawkVision" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">HawkVision</div>
        <div class="brand-sub">Unified Access Portal</div>
      </div>
    </div>
    <div class="version">Portal v1.1.12</div>
  </header>

  <main>
    <section id="loginView" class="card">
      <h1>登入 HawkVision</h1>
      <p class="lead">登入後，只會顯示目前帳號已取得使用權限的系統。</p>

      <label for="account">帳號</label>
      <input id="account" autocomplete="username" placeholder="請輸入帳號" />

      <label for="password">密碼</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" />
        <button id="eyeBtn" class="eye" type="button">👁</button>
      </div>

      <div id="loginMsg" class="msg"></div>
      <button id="loginBtn" class="primary" type="button">登入</button>
    </section>

    <section id="passwordClaimView" class="card">
      <h1>首次登入｜設定新密碼</h1>
      <p class="claim-hint">第一次登入必須先設定自己的新密碼；設定成功後系統會登出，請使用新密碼重新登入。</p>

      <label for="newPassword">新密碼</label>
      <div class="pw">
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 8 個字元" />
        <button id="newPasswordEye" class="eye" type="button">👁</button>
      </div>

      <label for="newPassword2">再次輸入新密碼</label>
      <div class="pw">
        <input id="newPassword2" type="password" autocomplete="new-password" placeholder="再次輸入新密碼" />
        <button id="newPasswordEye2" class="eye" type="button">👁</button>
      </div>

      <div id="claimMsg" class="msg"></div>
      <div class="claim-actions">
        <button id="claimSubmitBtn" class="primary" type="button">設定新密碼並重新登入</button>
        <button id="claimBackBtn" class="claim-back" type="button">返回登入</button>
      </div>
    </section>

    <section id="launcherView">
      <div class="welcome card">
        <div>
          <h2 id="welcomeName">歡迎</h2>
          <p id="welcomeAccount"></p>
        </div>
        <button id="logoutBtn" class="logout" type="button">登出</button>
      </div>
      <div id="productGrid" class="products"></div>
    </section>
  </main>

  <footer>HawkVision · Secure Unified Access</footer>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const PORTAL_VERSION="1.1.12";
const SUPABASE_URL="https://rwxujvpakpemiwkitltk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aN_1_fzAV3hR6FmW7FTZGg_6SF0MUHF";
const ADMIN_API="https://hawkvision-admin-api.michael19941009.workers.dev";


const HV_ACTIVE_COOKIE="hv-active-user";
function hvSetActiveUser(userId){
  document.cookie=`${HV_ACTIVE_COOKIE}=${encodeURIComponent(userId||"")}; Domain=.hawkvisionai.com; Path=/; Max-Age=2592000; SameSite=Lax; Secure`;
}
function hvGetActiveUser(){
  const p=HV_ACTIVE_COOKIE+"=";
  const row=document.cookie.split("; ").find(v=>v.startsWith(p));
  return row?decodeURIComponent(row.slice(p.length)):"";
}
function hvClearActiveUser(){
  document.cookie=`${HV_ACTIVE_COOKIE}=; Domain=.hawkvisionai.com; Path=/; Max-Age=0; SameSite=Lax; Secure`;
}
function hvBuildSsoUrl(baseUrl,session){
  if(!session?.access_token||!session?.refresh_token)return baseUrl;
  const hash=new URLSearchParams({
    hv_at:session.access_token,
    hv_rt:session.refresh_token
  }).toString();
  return `${baseUrl.replace(/#.*$/,"")}#${hash}`;
}

const client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const PRODUCT_META={
  record_platform:{icon:"📝",description:"牌局記錄、牌靴管理與記錄作業"},
  admin_center:{icon:"⚙️",description:"帳號、層級、額度與平台管理"},
  analysis_engine:{icon:"📊",description:"HawkVision 分析與模型引擎"}
};

const $=id=>document.getElementById(id);
let busy=false;

function showLoginMessage(text,type="error"){
  const el=$("loginMsg");
  el.textContent=text;
  el.className="msg "+type;
}
function clearLoginMessage(){
  $("loginMsg").className="msg";
  $("loginMsg").textContent="";
}
function setBusy(value){
  busy=value;
  $("loginBtn").disabled=value;
  $("loginBtn").textContent=value?"登入中…":"登入";
}
function internalCandidates(account){
  const raw=String(account||"").trim().toLowerCase();
  if(!raw)return[];
  if(raw.includes("@"))return[raw];
  // Existing HawkVision identities currently use two internal email namespaces.
  return [`${raw}@baccarat.local`,`${raw}@hawkvision.local`];
}
async function signInByAccount(account,password){
  const candidates=internalCandidates(account);
  let lastError=null;
  for(const email of candidates){
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(!error&&data?.user)return data;
    lastError=error;
  }
  throw lastError||new Error("登入失敗");
}

function showClaimMessage(text,type="error"){
  const el=$("claimMsg");
  el.textContent=text;
  el.className="msg "+type;
}
function clearClaimMessage(){
  $("claimMsg").className="msg";
  $("claimMsg").textContent="";
}
function showLoginView(){
  $("passwordClaimView").style.display="none";
  $("launcherView").style.display="none";
  $("loginView").style.display="block";
}
function showPasswordClaim(){
  clearClaimMessage();
  $("loginView").style.display="none";
  $("launcherView").style.display="none";
  $("passwordClaimView").style.display="block";
  $("newPassword").value="";
  $("newPassword2").value="";
  $("claimSubmitBtn").disabled=false;
  $("claimSubmitBtn").textContent="設定新密碼並重新登入";
  setTimeout(()=>$("newPassword")?.focus(),0);
}
async function requiresPasswordClaim(user){
  if(!user?.id)return false;
  const {data,error}=await client.from("profiles").select("must_change_password").eq("id",user.id).maybeSingle();
  if(error)throw error;
  return data?.must_change_password===true;
}
async function returnToLogin(){
  $("claimBackBtn").disabled=true;
  try{
    await client.auth.signOut({scope:"global"}).catch(()=>{});
  }finally{
    hvClearActiveUser();
    showLoginView();
    $("password").value="";
    $("claimBackBtn").disabled=false;
  }
}
async function submitPasswordClaim(){
  const p1=$("newPassword").value||"";
  const p2=$("newPassword2").value||"";
  clearClaimMessage();
  if(p1.length<8){
    showClaimMessage("新密碼至少需要 8 個字元");
    return;
  }
  if(p1!==p2){
    showClaimMessage("兩次輸入的新密碼不一致");
    return;
  }
  const {data:{session}}=await client.auth.getSession();
  if(!session?.access_token){
    showClaimMessage("登入狀態已失效，請重新登入");
    return;
  }
  const btn=$("claimSubmitBtn");
  btn.disabled=true;
  btn.textContent="設定中…";
  try{
    const res=await fetch(ADMIN_API+"/claim-password",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+session.access_token
      },
      body:JSON.stringify({new_password:p1})
    });
    const d=await res.json().catch(()=>({}));
    if(!res.ok||!d.ok)throw new Error(d.error||"密碼設定失敗");

    const {data:verify,error:verifyError}=await client.from("profiles")
      .select("must_change_password")
      .eq("id",session.user.id)
      .maybeSingle();
    if(verifyError)throw verifyError;
    if(verify?.must_change_password===true){
      throw new Error("密碼已送出但首次登入狀態尚未解除，請稍後再試");
    }

    await client.auth.signOut({scope:"global"}).catch(()=>{});
    hvClearActiveUser();
    showLoginView();
    $("password").value="";
    showLoginMessage("密碼設定成功，請使用新密碼重新登入","success");
  }catch(e){
    showClaimMessage(e?.message||String(e));
    btn.disabled=false;
    btn.textContent="設定新密碼並重新登入";
  }
}

async function loadLauncher(){
  const {data:{session}}=await client.auth.getSession();
  if(!session?.user){
    $("passwordClaimView").style.display="none";
    $("launcherView").style.display="none";
    $("loginView").style.display="block";
    return;
  }

  let mustChange=false;
  try{
    mustChange=await requiresPasswordClaim(session.user);
  }catch(_e){
    await client.auth.signOut().catch(()=>{});
    hvClearActiveUser();
    showLoginView();
    showLoginMessage("無法確認首次登入狀態，請重新登入");
    return;
  }
  if(mustChange){
    hvSetActiveUser(session.user.id);
    showPasswordClaim();
    return;
  }

  hvSetActiveUser(session.user.id);
  const {data,error}=await client.rpc("hv_unified_launcher");
  if(error){
    await client.auth.signOut();
    $("passwordClaimView").style.display="none";
    $("launcherView").style.display="none";
    $("loginView").style.display="block";
    showLoginMessage("無法讀取帳號權限，請重新登入");
    return;
  }

  $("welcomeName").textContent=`${data?.display_name||data?.account||"使用者"}，歡迎回來`;
  $("welcomeAccount").textContent=`帳號：${data?.account||"—"}`;

  const enabled=(Array.isArray(data?.products)?data.products:[]).filter(p=>p?.is_enabled===true);

  // v1.1.8: 會員只有分析引擎可使用時，不顯示平台選擇，直接進入分析引擎。
  // 優先使用 launcher 回傳角色；若舊版 launcher 未帶角色，讀取自己的 business_role 作為相容處理。
  let businessRole=String(data?.business_role||data?.role||data?.role_key||"").trim();
  if(!businessRole){
    try{
      const {data:selfBiz}=await client.from("hv_business_accounts").select("business_role").eq("user_id",session.user.id).maybeSingle();
      businessRole=String(selfBiz?.business_role||"").trim();
    }catch(_e){}
  }
  if((businessRole==="member" || enabled.length===1) && enabled.length===1 && enabled[0]?.product_key==="analysis_engine"){
    window.location.replace(hvBuildSsoUrl(enabled[0].base_url,session));
    return;
  }

  const grid=$("productGrid");
  if(!enabled.length){
    grid.innerHTML='<div class="card none">目前沒有可使用的系統權限，請聯絡管理員。</div>';
  }else{
    grid.innerHTML=enabled.map(p=>{
      const meta=PRODUCT_META[p.product_key]||{icon:"◼",description:""};
      return `<a class="product" href="${hvBuildSsoUrl(p.base_url,session)}">
        <div>
          <div class="product-icon">${meta.icon}</div>
          <h3>${p.display_name}</h3>
          <p>${meta.description}</p>
        </div>
        <div class="enter">進入系統 →</div>
      </a>`;
    }).join("");
  }

  $("loginView").style.display="none";
  $("launcherView").style.display="block";
}
async function login(){
  if(busy)return;
  const account=$("account").value.trim();
  const password=$("password").value;
  clearLoginMessage();
  if(!account||!password){
    showLoginMessage("請輸入帳號和密碼");
    return;
  }
  setBusy(true);
  try{
    await signInByAccount(account,password);
    await loadLauncher();
  }catch{
    await client.auth.signOut().catch(()=>{});
    showLoginMessage("登入失敗，請確認帳號或密碼");
  }finally{
    setBusy(false);
  }
}
$("claimSubmitBtn").addEventListener("click",submitPasswordClaim);
$("claimBackBtn").addEventListener("click",returnToLogin);
$("newPassword2").addEventListener("keydown",e=>{if(e.key==="Enter")submitPasswordClaim()});
$("newPasswordEye").addEventListener("click",()=>{
  const input=$("newPassword");
  input.type=input.type==="password"?"text":"password";
  $("newPasswordEye").textContent=input.type==="password"?"👁":"🙈";
});
$("newPasswordEye2").addEventListener("click",()=>{
  const input=$("newPassword2");
  input.type=input.type==="password"?"text":"password";
  $("newPasswordEye2").textContent=input.type==="password"?"👁":"🙈";
});
$("loginBtn").addEventListener("click",login);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("eyeBtn").addEventListener("click",()=>{
  const input=$("password");
  input.type=input.type==="password"?"text":"password";
  $("eyeBtn").textContent=input.type==="password"?"👁":"🙈";
});
$("logoutBtn").addEventListener("click",async()=>{
  await client.auth.signOut({scope:"global"}); hvClearActiveUser();
  $("productGrid").innerHTML="";
  $("passwordClaimView").style.display="none";
  $("launcherView").style.display="none";
  $("loginView").style.display="block";
  $("password").value="";
});
client.auth.onAuthStateChange((_event,session)=>{
  if(!session){
    $("passwordClaimView").style.display="none";
    $("launcherView").style.display="none";
    $("loginView").style.display="block";
  }
});
setTimeout(()=>{
  const intro=document.getElementById("hvIntro");
  if(intro){
    intro.classList.add("is-leaving");
    setTimeout(()=>intro.remove(),500);
  }
},1500);

async function hvHandleLogoutLanding(){
  const url=new URL(window.location.href);
  if(url.searchParams.get("logout")!=="1") return false;

  // 子平台已先執行 global signOut；Portal 再清除自己保留的本地 session。
  await client.auth.signOut({scope:"local"}).catch(()=>{});
  await client.auth.signOut({scope:"global"}).catch(()=>{});
  hvClearActiveUser();

  $("productGrid").innerHTML="";
  $("passwordClaimView").style.display="none";
  $("launcherView").style.display="none";
  $("loginView").style.display="block";
  $("account").value="";
  $("password").value="";
  clearLoginMessage();

  // 移除 ?logout=1，避免重新整理時重複執行。
  history.replaceState(null,"",url.pathname);
  return true;
}

(async()=>{
  const loggedOut=await hvHandleLogoutLanding();
  if(!loggedOut) await loadLauncher();
})();
</script>
